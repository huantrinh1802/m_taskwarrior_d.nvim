name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: lunarmodules/luacheck@v1
        with:
          args: lua

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - nvim: v0.10.4
            coverage: false
          - nvim: stable
            coverage: true
    steps:
      - uses: actions/checkout@v5
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.nvim }}
      - name: Install Taskwarrior
        run: sudo apt-get update && sudo apt-get install -y taskwarrior
      - uses: leafo/gh-actions-lua@v10
        if: matrix.coverage
        with:
          luaVersion: luajit-2.1
      - uses: leafo/gh-actions-luarocks@v4
        if: matrix.coverage
      - name: Install luacov
        if: matrix.coverage
        run: luarocks install luacov
      - name: Versions
        run: |
          nvim --version | head -1
          task --version
      - name: Tests
        if: ${{ !matrix.coverage }}
        run: scripts/test.sh
      - name: Tests with coverage
        if: matrix.coverage
        run: |
          eval "$(luarocks path)"
          COVERAGE=1 COVERAGE_MIN=100 scripts/test.sh
