name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: lunarmodules/luacheck@v1
        with:
          args: lua

  test:
    runs-on: ubuntu-latest
    env:
      TASKWARRIOR_VERSION: 3.5.0
    strategy:
      fail-fast: false
      matrix:
        include:
          - nvim: v0.10.4
            coverage: false
          - nvim: stable
            coverage: true
    steps:
      - uses: actions/checkout@v5
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.nvim }}
      # Ubuntu only packages Taskwarrior 2.6 and upstream ships source only,
      # so build the release once and cache the install.
      - name: Cache Taskwarrior
        id: taskwarrior-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/taskwarrior
          key: taskwarrior-${{ env.TASKWARRIOR_VERSION }}-${{ runner.os }}
      - name: Build Taskwarrior
        if: steps.taskwarrior-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL "https://github.com/GothenburgBitFactory/taskwarrior/releases/download/v${TASKWARRIOR_VERSION}/task-${TASKWARRIOR_VERSION}.tar.gz" | tar xz
          cmake -S "task-${TASKWARRIOR_VERSION}" -B tw-build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$HOME/.local/taskwarrior"
          cmake --build tw-build -j "$(nproc)"
          cmake --install tw-build
      - name: Add Taskwarrior to PATH
        run: echo "$HOME/.local/taskwarrior/bin" >> "$GITHUB_PATH"
      - uses: leafo/gh-actions-lua@v10
        if: matrix.coverage
        with:
          luaVersion: luajit-2.1
      - uses: leafo/gh-actions-luarocks@v4
        if: matrix.coverage
      - name: Install luacov
        if: matrix.coverage
        run: luarocks install luacov
      - name: Versions
        run: |
          nvim --version | head -1
          task --version
      - name: Tests
        if: ${{ !matrix.coverage }}
        run: scripts/test.sh
      - name: Tests with coverage
        if: matrix.coverage
        run: |
          eval "$(luarocks path)"
          COVERAGE=1 COVERAGE_MIN=100 scripts/test.sh
