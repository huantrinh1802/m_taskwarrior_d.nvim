name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: lunarmodules/luacheck@v1
        with:
          args: lua

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nvim: [v0.10.4, stable]
    steps:
      - uses: actions/checkout@v5
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.nvim }}
      - name: Install Taskwarrior
        run: sudo apt-get update && sudo apt-get install -y taskwarrior
      - name: Versions
        run: |
          nvim --version | head -1
          task --version
      - name: test_task_batch
        run: nvim --headless -u NONE -c "lua dofile('lua/tests/test_task_batch.lua')"
      - name: test_sync_render
        run: nvim --headless -u NONE -c "lua dofile('lua/tests/test_sync_render.lua')"
